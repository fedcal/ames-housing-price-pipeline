# MkDocs config — sito documentazione PW4 Ames Housing.
# Tema Material (mobile-first), SEO via meta + struttura nav.

site_name: Ames Housing — Pipeline ML End-to-End
site_description: >-
  Pipeline ML production-friendly per la previsione dei prezzi immobiliari
  sul dataset Ames Housing (De Cock 2011). Preprocessing modulare, 3 modelli
  candidati (Ridge / RandomForest / XGBoost), tuning K-fold, predict_price().
site_author: Federico Calò
site_url: https://fedcal.github.io/ames-housing-price-pipeline/

repo_name: fedcal/ames-housing-price-pipeline
repo_url: https://github.com/fedcal/ames-housing-price-pipeline
edit_uri: edit/main/docs/

copyright: >-
  Copyright &copy; 2026 <a href="https://federicocalo.dev" target="_blank" rel="noopener">Federico Calò</a> —
  Distribuito sotto licenza <a href="https://opensource.org/licenses/MIT" target="_blank" rel="noopener">MIT</a>.

theme:
  name: material
  language: it
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - toc.follow
    - announce.dismiss
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Modalità scura
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Modalità chiara
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fedcal
      name: GitHub di Federico Calò
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/federicocalo/
      name: LinkedIn
    - icon: fontawesome/solid/globe
      link: https://federicocalo.dev
      name: Sito personale
  homepage: https://federicocalo.dev

plugins:
  - search:
      lang: [it, en]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      permalink_title: Link permanente alla sezione
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Teoria:
      - Regressione & target log: teoria/01_regressione_e_target_log.md
      - Regolarizzazione: teoria/02_regolarizzazione.md
      - Random Forest & Boosting: teoria/03_random_forest_e_boosting.md
      - Metriche di regressione: teoria/04_metriche_regressione.md
      - Pipeline & data leakage: teoria/05_pipeline_e_data_leakage.md
  - Scelte tecniche:
      - Architettura: scelte_tecniche/architettura.md
      - Scelte di modellazione: scelte_tecniche/scelte_modello.md
