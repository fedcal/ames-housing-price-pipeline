[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ames-pipeline"
version = "0.1.0"
description = "Pipeline end-to-end di Machine Learning per la previsione del prezzo di vendita immobiliare sul dataset Ames Housing (De Cock 2011)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Federico Calò", email = "fedcal01@gmail.com" }]
keywords = ["machine-learning", "regression", "ames-housing", "scikit-learn", "xgboost", "tutorial"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "scikit-learn>=1.6,<2.0",
    "scipy>=1.13,<2.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "xgboost>=2.1,<3.0",
    "lightgbm>=4.5,<5.0",
    "joblib>=1.4,<2.0",
    "pyyaml>=6.0,<7.0",
    "requests>=2.32,<3.0",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "nbformat>=5.10",
    "nbconvert>=7.16",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
ames-train = "ames_pipeline.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py311"
